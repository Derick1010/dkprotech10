.galadm div{position:relative}.galadm img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block}
.galadm button{position:absolute;top:4px;right:4px;background:var(--r);color:#fff;width:26px;height:26px;border-radius:50%;font-size:13px}

.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;font-size:18px;padding:6px}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;display:none;color:#000;max-width:92vw;text-align:center}

 h1{font-size:24px}
}
@media(max-width:600px){
 .grid{grid-template-columns:repeat(5,1fr)}.board{grid-template-columns:repeat(5,1fr)}

 nav a{padding:6px 7px;font-size:12px}

 .note{font-size:15px}
}
@media(max-width:430px){
 .brand span{display:none}
 .hbar{gap:8px}
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, runTransaction, setDoc, getDoc, getDocs, writeBatch, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= CONFIGURACIÓN ================= */
const firebaseConfig = {
  apiKey: "AIzaSyC79MwvsE9yOG5sYjdGYndm73PqqI9jSfA",
  authDomain: "dkprotech.firebaseapp.com",
  projectId: "dkprotech",
  storageBucket: "dkprotech.firebasestorage.app",
  messagingSenderId: "1092801700019",
  appId: "1:1092801700019:web:186252155730900f5710c6",
  measurementId: "G-3G5M7J3RGD"
};
const ADMIN_USER = "DerickG";                 // usuario del panel
const ADMIN_DOMAIN = "dkprotech.app";         // no cambiar
const ADMIN_EMAIL = (ADMIN_USER + "@" + ADMIN_DOMAIN).toLowerCase();
const OWNER_WA = "18098298455";               // WhatsApp donde recibes las compras
const PHONE_CODES = ["809", "829", "849"];    // códigos válidos de teléfono (RD)
/* ================================================= */

const DEF = {
  title: "iPhone 16 Pro Max 256GB", description: "Equipo revisado y con sello de garantía DK Protech.",
  price: 300, minNumbers: 1, maxNumbers: 5, drawDate: "", drawTime: "14:30", lottery: "Lotería Nacional (Gana Más)",
  unsoldRule: "Si el número ganador no fue vendido, se toma el 2do premio del mismo sorteo.",
  pauseMsg: "La venta está pausada en este momento. Mantente pendiente de nuestras redes.",
  accounts: [{ bank: "Banco Popular", type: "Ahorro", number: "000000000", holder: "Tu Nombre", logo: "" }],
  whatsapp: OWNER_WA, winningNumber: "", winnerName: "", open: true, showCountdown: true, logo: "", prizeImg: ""
};
const NUMS = Array.from({ length: 100 }, (_, i) => String(i).padStart(2, "0"));
const S = { settings: { ...DEF }, numbers: {}, orders: [], gallery: [], sel: [], msel: [], gi: 0, user: null, tab: "pedidos", filter: "pendiente", q: "", draftAcc: null, ready: false, unsubOrders: null };

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const digits = (s) => String(s || "").replace(/\D/g, "");
const normPhone = (v) => { let d = digits(v); if (d.length === 11 && d[0] === "1") d = d.slice(1); return d; };
const validPhone = (v) => { const d = normPhone(v); return d.length === 10 && PHONE_CODES.includes(d.slice(0, 3)); };
const fmtPhone = (d) => d.length > 6 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6, 10)}` : d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d;
const money = (n) => "RD$ " + Number(n || 0).toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = (d) => d ? new Date(d + "T12:00").toLocaleDateString("es-DO", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "Por anunciar";
const fmtTime = (t) => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`; };
const fmtDT = (ts) => { const d = ts?.toDate ? ts.toDate() : null; return d ? d.toLocaleString("es-DO", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "ahora"; };
const route = () => (location.hash.replace("#/", "") || "home").split("?")[0];
const isAdmin = () => !!S.user && S.user.email?.toLowerCase() === ADMIN_EMAIL;
const maxN = () => Math.max(1, Number(S.settings.maxNumbers) || 5);

/* formatea y valida un campo de teléfono mientras se escribe */
function phoneField(input) {
  input.type = "tel";
  input.setAttribute("maxlength", "16");
  const check = () => {
    const d = normPhone(input.value);
    input.classList.toggle("good", validPhone(d));
    input.classList.toggle("bad", d.length >= 10 && !validPhone(d));
  };
  input.addEventListener("input", () => {
    if (/[^0-9\-\s()+]/.test(input.value)) input.value = input.value.replace(/[^0-9\-\s()+]/g, "");
    check();
  });
  input.addEventListener("blur", () => { const d = normPhone(input.value); if (d) input.value = fmtPhone(d.slice(0, 10)); check(); });
}

function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.style.background = err ? "var(--r)" : "var(--g)"; t.style.display = "block"; clearTimeout(t._t); t._t = setTimeout(() => (t.style.display = "none"), 3400); }
function openModal(html, wide) { $("#modal").innerHTML = `<div class="ov"><div class="md ${wide ? "wide" : ""}">${html}</div></div>`; $("#modal .ov").addEventListener("click", (e) => { if (e.target.classList.contains("ov")) closeModal(); }); $$("#modal [data-close]").forEach((b) => (b.onclick = closeModal)); }
function closeModal() { $("#modal").innerHTML = ""; }
function ask(msg, danger = true) { return new Promise((res) => { openModal(`<div class="mb center"><div style="font-size:40px">⚠️</div><p>${esc(msg)}</p><div class="row"><button class="btn" style="flex:1" id="cn">Cancelar</button><button class="btn ${danger ? "redf" : "green"}" style="flex:1" id="cy">Confirmar</button></div></div>`); $("#cn").onclick = () => { closeModal(); res(false); }; $("#cy").onclick = () => { closeModal(); res(true); }; }); }
async function copy(t) { try { await navigator.clipboard.writeText(t); } catch { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); } toast("Copiado ✔"); }
function compress(file, max = 1000, q = 0.65, type = "image/jpeg") { return new Promise((res, rej) => { const r = new FileReader(); r.onload = (e) => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL(type, q)); }; img.onerror = rej; img.src = e.target.result; }; r.onerror = rej; r.readAsDataURL(file); }); }
function waLink(phone, msg) { const p = digits(phone); return `https://wa.me/${p.length === 10 ? "1" + p : p}?text=${encodeURIComponent(msg)}`; }
async function runOps(ops) { for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach((f) => f(b)); await b.commit(); } }

function logoSVG(size = 40, id = "a") {
  let dots = ""; for (let i = 0; i < 14; i++) { const a = -0.2 + i * 0.13; dots += `<circle cx="${56 + Math.cos(a) * 30}" cy="${66 + Math.sin(a) * 30}" r="${2.4 - i * 0.12}" fill="#fff" opacity="${1 - i * 0.05}"/>`; }
  return `<svg viewBox="0 0 100 112" width="${size}" height="${size * 1.12}"><defs><linearGradient id="g1${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient><linearGradient id="g2${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d72e8"/><stop offset="1" stop-color="#2e2a7a"/></linearGradient></defs><path d="M30 42 V30 a20 20 0 0 1 40 0 V42" fill="none" stroke="url(#g1${id})" stroke-width="9"/><path d="M16 42 H86 V64 C86 86 66 100 51 108 C35 100 16 86 16 64Z" fill="url(#g2${id})"/><path d="M8 74 C28 40 70 30 94 42 C70 42 42 54 28 96 Z" fill="url(#g1${id})"/><circle cx="56" cy="66" r="11" fill="#0b0d1a"/><circle cx="56" cy="66" r="6" fill="#22c55e"/>${dots}</svg>`;
}

const galImgs = () => [S.settings.prizeImg, ...S.gallery.map((g) => g.img)].filter(Boolean);
function galleryHTML() {
  const imgs = galImgs();
  if (!imgs.length) return `<div class="prize">${logoSVG(130, "p")}</div>`;
  if (S.gi >= imgs.length) S.gi = 0;
  const many = imgs.length > 1;
  return `<div><div class="prize" id="galMain" style="position:relative">
    <img id="galImg" src="${imgs[S.gi]}" alt="Premio" data-gal="zoom" style="cursor:zoom-in">
    ${many ? `<button class="garr gl" data-gal="prev">‹</button><button class="garr gr" data-gal="next">›</button><span class="gcount" id="galCnt">${S.gi + 1}/${imgs.length}</span>` : ""}
  </div>
  ${many ? `<div class="thumbs">${imgs.map((src, i) => `<img src="${src}" data-gal="${i}" class="${i === S.gi ? "on" : ""}" alt="foto ${i + 1}">`).join("")}</div>` : ""}</div>`;
}
function galGo(i) {
  const imgs = galImgs(); if (!imgs.length) return;
  S.gi = (i + imgs.length) % imgs.length;
  const im = $("#galImg"); if (!im) return;
  im.style.opacity = 0; setTimeout(() => { im.src = imgs[S.gi]; im.style.opacity = 1; }, 150);
  const c = $("#galCnt"); if (c) c.textContent = `${S.gi + 1}/${imgs.length}`;
  $$(".thumbs img").forEach((t, j) => t.classList.toggle("on", j === S.gi));
}
let galTouch = 0, galX = 0;
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-gal]"); if (!g) return;
  const v = g.dataset.gal; galTouch = Date.now();
  if (v === "prev") galGo(S.gi - 1);
  else if (v === "next") galGo(S.gi + 1);
  else if (v === "zoom") openModal(`<div class="mh"><b>${esc(S.settings.title)}</b><button class="x" data-close>✕</button></div><div class="mb center"><img src="${galImgs()[S.gi]}" style="max-width:100%;max-height:78vh;border-radius:10px"></div>`, true);
  else galGo(+v);
});
document.addEventListener("touchstart", (e) => { if (e.target.closest("#galMain")) galX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!galX) return; const dx = e.changedTouches[0].clientX - galX; galX = 0;
  if (Math.abs(dx) > 40) { galTouch = Date.now(); galGo(S.gi + (dx < 0 ? 1 : -1)); }
});
setInterval(() => { if (route() === "home" && !$("#modal .ov") && galImgs().length > 1 && Date.now() - galTouch > 8000) galGo(S.gi + 1); }, 4000);

function toggleNum(n) {

}

function tick() {
  const el = $("#cd"), tl = $("#cdt"); if (!el || !tl) return; const s = S.settings;
  const d = new Date(`${s.drawDate}T${s.drawTime || "00:00"}:00`).getTime() - Date.now();
  if (d <= 0) { tl.innerHTML = "🎉 ¡Llegó el día del sorteo!"; el.style.display = "none"; return; }
  const days = Math.floor(d / 864e5);

  // Días de calendario (cambia a las 12:00 AM)
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const diaSorteo = new Date(`${s.drawDate}T00:00:00`);
  const diasCal = Math.round((diaSorteo - hoy) / 864e5);

  tl.innerHTML = diasCal >= 2 ? `⏳ Faltan <b>${diasCal}</b> días para el sorteo`
    : diasCal === 1 ? `⏳ ¡El sorteo es <b>MAÑANA</b>!`
    : `⏳ ¡El sorteo es <b>HOY</b>!`;

  const v = [[days, "Días"], [Math.floor(d / 36e5) % 24, "Horas"], [Math.floor(d / 6e4) % 60, "Min"], [Math.floor(d / 1e3) % 60, "Seg"]];
  el.style.display = ""; el.innerHTML = v.map(([n, l]) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l}</span></div>`).join("");
}
setInterval(tick, 1000);

async function submitOrder() {
  const s = S.settings, name = $("#cName").value.trim(), phone = normPhone($("#cPhone").value), a = s.accounts[CO.acc];
  if (!s.open || s.winningNumber) return showErr("La venta está pausada en este momento.");
  if (S.sel.length > maxN()) return showErr(`Máximo ${maxN()} números por transferencia.`);
  if (name.split(/\s+/).length < 2) return showErr("Escribe tu nombre y apellido.");
  if (!validPhone(phone)) { $("#cPhone").classList.add("bad"); return showErr("Escribe un número de WhatsApp válido de 10 dígitos que empiece con 809, 829 u 849 (ej: 809-555-5555)."); }
  if (!a) return showErr("Selecciona un método de pago.");
  if (!CO.voucher) return showErr("Sube el comprobante de la transferencia.");
  if (!$("#cTerms").checked) return showErr("Debes aceptar los términos.");
  const btn = $("#cSend"); btn.disabled = true; btn.textContent = "ENVIANDO..."; showErr("");
  const numbers = [...S.sel].sort(), total = numbers.length * s.price, account = `${a.bank} (${a.type})`;
  const orderRef = doc(collection(db, "orders")), id = orderRef.id;
  try {
    await runTransaction(db, async (tx) => {
      const refs = numbers.map((n) => doc(db, "numbers", n));
      const snaps = await Promise.all(refs.map((r) => tx.get(r)));
      const busy = snaps.filter((x) => x.exists()).map((x) => x.id);
      if (busy.length) throw new Error("BUSY:" + busy.join(", "));
      tx.set(orderRef, { name, phone, numbers, total, account: `${account} ${a.number}`, status: "pendiente", createdAt: serverTimestamp() });
      tx.set(doc(db, "vouchers", id), { img: CO.voucher });
      tx.set(doc(db, "lookup", phone, "items", id), { numbers, total, status: "pendiente", createdAt: serverTimestamp() });
      refs.forEach((r) => tx.set(r, { status: "reservado", orderId: id }));
    });
    S.sel = []; updateBar();
    openModal(`<div class="mb center">
      <div style="font-size:50px">✅</div><h2>¡COMPRA RECIBIDA!</h2>
      <p class="muted">Gracias ${esc(name.split(" ")[0])}. Tus números quedaron reservados.</p>
      <div class="chips" style="justify-content:center;margin:14px 0">${numbers.map((n) => `<span class="chip a" style="font-size:20px;padding:10px 14px">${n}</span>`).join("")}</div>

async function viewVoucher(id) {

function approveOps(o) {
  const ops = [(b) => b.update(doc(db, "orders", o.id), { status: "aprobado", validatedAt: serverTimestamp() })];
  if (o.phone) ops.push((b) => b.set(doc(db, "lookup", o.phone, "items", o.id), { numbers: o.numbers, total: o.total, status: "aprobado" }, { merge: true }));
  o.numbers.forEach((n) => ops.push((b) => b.set(doc(db, "numbers", n), { status: "vendido", orderId: o.id })));
  return ops;
}
function rejectOps(o) {
  const ops = [(b) => b.update(doc(db, "orders", o.id), { status: "rechazado", validatedAt: serverTimestamp() })];
  if (o.phone) ops.push((b) => b.set(doc(db, "lookup", o.phone, "items", o.id), { status: "rechazado" }, { merge: true }));
  o.numbers.forEach((n) => { if (S.numbers[n]?.orderId === o.id) ops.push((b) => b.delete(doc(db, "numbers", n))); });
  return ops;
}
async function approve(id) {
  const o = getO(id); if (!o) return;
  const conflict = o.numbers.filter((n) => S.numbers[n] && S.numbers[n].orderId !== id);
  if (conflict.length) return toast(`Los números ${conflict.join(", ")} ya están tomados por otra persona`, true);
  try { await runOps(approveOps(o)); toast("Pago aprobado ✔ Números marcados como vendidos"); } catch (e) { console.error(e); toast("Error al aprobar", true); }
}
async function reject(id) {
  const o = getO(id); if (!o) return;
  try { await runOps(rejectOps(o)); toast("Rechazado, números liberados"); } catch (e) { console.error(e); toast("Error al rechazar", true); }
}
async function del(id) {
  const o = getO(id); if (!o) return;
  const ops = [(b) => b.delete(doc(db, "orders", id)), (b) => b.delete(doc(db, "vouchers", id))];
  if (o.phone) ops.push((b) => b.delete(doc(db, "lookup", o.phone, "items", id)));
  o.numbers.forEach((n) => { if (S.numbers[n]?.orderId === id) ops.push((b) => b.delete(doc(db, "numbers", n))); });
  try { await runOps(ops); toast("Registro eliminado"); } catch (e) { console.error(e); toast("Error al eliminar", true); }
}

      });
      S.msel = []; closeModal(); toast("Venta registrada ✔"); tabTablero();
    } catch (e) {
      $("#mGo").disabled = false;
      $("#mErr").innerHTML = `<div class="err">${String(e.message).startsWith("BUSY:") ? "Estos números se acaban de ocupar: " + e.message.slice(5) : "No se pudo guardar. Revisa las reglas de Firebase."}</div>`;
      console.error(e);
    }
  };
}

/* ----- configuración ----- */
function tabConfig() {
  const s = S.settings; if (!S.draftAcc) S.draftAcc = JSON.parse(JSON.stringify(s.accounts || []));
  $("#tabc").innerHTML = `<div class="card">
    <div class="f2">
      <label>Premio / título<input id="fTitle" value="${esc(s.title)}"></label>
      <label>Precio por número (RD$)<input id="fPrice" type="number" min="1" value="${esc(s.price)}"></label>
      <label class="span2">Descripción<textarea id="fDesc" rows="2">${esc(s.description)}</textarea></label>
      <label>Fecha del sorteo<input id="fDate" type="date" value="${esc(s.drawDate)}"></label>
      <label>Hora del sorteo<input id="fTime" type="time" value="${esc(s.drawTime)}"></label>
      <label class="chk span2" style="font-size:14px;color:var(--t);align-items:center"><input type="checkbox" id="fCd" ${s.showCountdown ? "checked" : ""}> Mostrar conteo de días restantes en la página</label>
      <label>Lotería con la que juega<input id="fLot" value="${esc(s.lottery)}"></label>
      <label>Tu WhatsApp (ej: 18098298455)<input id="fWa" value="${esc(s.whatsapp)}"></label>
      <label>Mínimo de números por compra<input id="fMin" type="number" min="1" value="${esc(s.minNumbers)}"></label>
      <label>Máximo de números por transferencia<input id="fMax" type="number" min="1" max="100" value="${esc(maxN())}"></label>
      <label class="span2">Regla si el número ganador no se vendió<input id="fRule" value="${esc(s.unsoldRule)}"></label>
      <label class="span2">Mensaje cuando la venta está pausada<input id="fPause" value="${esc(s.pauseMsg)}"></label>
    </div>
    <h3>Cuentas bancarias</h3>
    <p class="small muted" style="margin-top:-6px">Toca el cuadro <b>Logo</b> de cada cuenta para ponerle la imagen del banco. Luego toca <b>Guardar cambios</b>.</p>
    <div id="accs"></div>
    <button class="btn" id="addAcc" style="color:var(--g2)">＋ Agregar cuenta</button>
    <div class="f2" style="margin-top:20px">
      <div class="box span2"><div class="row between" style="margin-bottom:10px"><span>📸 Galería de fotos del premio <span class="small muted">(puedes elegir varias a la vez · pasan solas en la página)</span></span><label class="btn purple" style="margin:0">⬆️ Agregar fotos<input type="file" accept="image/*" multiple hidden id="upGal"></label></div><div id="galList">${galAdminList()}</div></div>
      <div class="box"><div style="margin-bottom:8px">Foto principal del premio</div>${s.prizeImg ? `<img src="${s.prizeImg}" style="max-height:110px;border-radius:8px;display:block;margin-bottom:8px">` : ""}
        <div class="row"><label class="btn purple" style="margin:0">⬆️ Subir<input type="file" accept="image/*" hidden id="upPrize"></label>${s.prizeImg ? `<button class="btn" id="rmPrize">Quitar</button>` : ""}</div></div>
      <div class="box"><div style="margin-bottom:8px">Tu logo</div>${s.logo ? `<img src="${s.logo}" style="max-height:80px;display:block;margin-bottom:8px">` : ""}
        <div class="row"><label class="btn purple" style="margin:0">⬆️ Subir<input type="file" accept="image/*" hidden id="upLogo"></label>${s.logo ? `<button class="btn" id="rmLogo">Quitar</button>` : ""}</div></div>
    </div>
    <button class="btn green full" id="saveCfg" style="margin-top:10px">💾 GUARDAR CAMBIOS</button>
  </div>`;
  const paintAccs = () => {
    $("#accs").innerHTML = S.draftAcc.map((a, i) => `<div class="accrow">
      <label class="lg" title="Logo del banco">${a.logo ? `<img src="${a.logo}" alt=""><span class="lgx" data-lgrm="${i}">✕</span>` : `🏦<span>Logo</span>`}<input type="file" accept="image/*" hidden data-lg="${i}"></label>
      <input data-i="${i}" data-k="bank" placeholder="Banco" value="${esc(a.bank)}">
      <input data-i="${i}" data-k="type" placeholder="Tipo (Ahorro)" value="${esc(a.type)}">
      <input data-i="${i}" data-k="number" placeholder="No. cuenta" value="${esc(a.number)}">
      <input data-i="${i}" data-k="holder" placeholder="Titular" value="${esc(a.holder)}">
      <button class="btn red" data-rm="${i}">✕</button></div>`).join("");
    $$("#accs input[data-k]").forEach((x) => (x.oninput = () => (S.draftAcc[x.dataset.i][x.dataset.k] = x.value)));
    $$("[data-rm]").forEach((b) => (b.onclick = () => { S.draftAcc.splice(+b.dataset.rm, 1); paintAccs(); }));
    $$("[data-lg]").forEach((inp) => (inp.onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try { S.draftAcc[+inp.dataset.lg].logo = await compress(f, 120, 0.92, "image/png"); paintAccs(); toast("Logo listo. Toca Guardar cambios 💾"); }
      catch (er) { console.error(er); toast("No se pudo leer la imagen", true); }
    }));
    $$("[data-lgrm]").forEach((x) => (x.onclick = (e) => { e.preventDefault(); e.stopPropagation(); S.draftAcc[+x.dataset.lgrm].logo = ""; paintAccs(); }));
  };
  paintAccs();
  $("#addAcc").onclick = () => { S.draftAcc.push({ bank: "", type: "Ahorro", number: "", holder: "", logo: "" }); paintAccs(); };
  const img = (id, key, max, q, type) => { const el = $(id); if (el) el.onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { await setDoc(doc(db, "settings", "main"), { [key]: await compress(f, max, q, type) }, { merge: true }); toast("Imagen guardada"); setTimeout(tabConfig, 400); } catch (er) { console.error(er); toast("Imagen muy pesada o error", true); } }; };
  img("#upPrize", "prizeImg", 1400, 0.8); img("#upLogo", "logo", 300, 0.92, "image/png");
  if ($("#rmPrize")) $("#rmPrize").onclick = async () => { await setDoc(doc(db, "settings", "main"), { prizeImg: "" }, { merge: true }); setTimeout(tabConfig, 400); };
  if ($("#rmLogo")) $("#rmLogo").onclick = async () => { await setDoc(doc(db, "settings", "main"), { logo: "" }, { merge: true }); setTimeout(tabConfig, 400); };
  $("#saveCfg").onclick = async () => {
    const mn = Math.max(1, Number($("#fMin").value) || 1), mx = Math.max(mn, Number($("#fMax").value) || 5);
    const data = { title: $("#fTitle").value.trim(), price: Number($("#fPrice").value) || 0, description: $("#fDesc").value.trim(), drawDate: $("#fDate").value, drawTime: $("#fTime").value, showCountdown: $("#fCd").checked, lottery: $("#fLot").value.trim(), minNumbers: mn, maxNumbers: mx, unsoldRule: $("#fRule").value.trim(), pauseMsg: $("#fPause").value.trim(), whatsapp: digits($("#fWa").value), accounts: S.draftAcc.filter((a) => a.bank && a.number) };
    try { await setDoc(doc(db, "settings", "main"), data, { merge: true }); toast("Cambios guardados ✔"); } catch (e) { console.error(e); toast("Error guardando. Si subiste muchas imágenes, prueba logos más pequeños.", true); }
  };
}

/* ----- sorteo y cierre ----- */
function tabSorteo() {
  const s = S.settings, pend = S.orders.filter((o) => o.status === "pendiente");
  $("#tabc").innerHTML = `
  <div class="card">
    <h3 style="margin-top:0">🏆 Registrar número ganador</h3>
    <p class="small muted">Escribe los 2 dígitos que salieron en ${esc(s.lottery)}. Al publicarlo se cierra la venta y el ganador aparece en la página.</p>
    <input id="wn" maxlength="2" inputmode="numeric" placeholder="00" value="${esc(s.winningNumber)}" style="text-align:center;font-size:40px;font-weight:900;letter-spacing:8px;max-width:220px">
    <div id="wInfo" style="margin:14px 0"></div>
    <div class="row"><button class="btn green" id="wPub">PUBLICAR GANADOR</button>${s.winningNumber ? `<button class="btn" id="wClr">Quitar ganador</button>` : ""}</div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">🔓 Liberar números reservados</h3>
    <p class="small muted">Libera todos los números que siguen <b>pendientes</b> (sin pago validado). Útil el día del sorteo para que no quede nada apartado sin pagar. Hay <b>${pend.length}</b> pedido(s) pendiente(s) con <b>${pend.reduce((t, o) => t + o.numbers.length, 0)}</b> número(s).</p>
    <button class="btn red" id="relPend" ${pend.length ? "" : "disabled"}>Liberar reservados pendientes</button>
  </div>
  <div class="card" style="border-color:var(--r)">
    <h3 style="margin-top:0">🔄 Terminar rifa y empezar una nueva</h3>
    <p class="small muted">Primero se descarga automáticamente un <b>Excel</b> con todos los pedidos como respaldo. Luego se borran todos los pedidos, comprobantes y números (vendidos y reservados), y los 100 números quedan libres. La venta queda <b>pausada</b> para que configures el nuevo premio. Las fotos, cuentas y ajustes se mantienen.</p>
    <button class="btn redf" id="reset">Terminar rifa y liberar todos los números</button>
  </div>`;
  const owner = (n) => S.orders.find((o) => o.status !== "rechazado" && o.numbers.includes(n));
  const paint = () => {
    const n = digits($("#wn").value); $("#wPub").disabled = n.length !== 2;
    if (n.length !== 2) return ($("#wInfo").innerHTML = "");
    const o = owner(n);
    $("#wInfo").innerHTML = o ? `<div class="box"><span class="small muted">Dueño del número ${n}:</span><h3 style="margin:4px 0">${esc(o.name)}</h3><div class="muted">📱 ${esc(o.phone ? fmtPhone(o.phone) : "sin teléfono")}</div><div style="margin-top:6px"><span class="badge b-${o.status}">${o.status.toUpperCase()}</span></div>${o.status === "pendiente" ? `<p class="small" style="color:var(--a)">Ojo: este pago aún no está validado.</p>` : ""}</div>` : `<div class="box" style="color:var(--a)">Este número no fue vendido. Aplica tu regla: ${esc(s.unsoldRule)}</div>`;
  };
  $("#wn").oninput = paint; paint();
  $("#wPub").onclick = async () => {
    const n = digits($("#wn").value), o = owner(n);
    const winnerName = o && o.status === "aprobado" ? `${o.name.split(" ")[0]} ${o.name.split(" ").slice(1).map((w) => w[0] + ".").join(" ")}` : "";
    await setDoc(doc(db, "settings", "main"), { winningNumber: n, winnerName, open: false }, { merge: true });
    toast("Ganador publicado 🏆"); setTimeout(tabSorteo, 300);
  };
  if ($("#wClr")) $("#wClr").onclick = async () => { await setDoc(doc(db, "settings", "main"), { winningNumber: "", winnerName: "" }, { merge: true }); toast("Ganador quitado"); setTimeout(tabSorteo, 300); };
  $("#relPend").onclick = async () => {
    if (!(await ask(`¿Liberar ${pend.length} pedido(s) pendiente(s)? Sus números quedarán disponibles y los pedidos pasarán a "rechazado".`))) return;
    try { await runOps(pend.flatMap(rejectOps)); toast("Reservados liberados ✔"); setTimeout(tabSorteo, 400); } catch (e) { console.error(e); toast("Error liberando", true); }
  };
  $("#reset").onclick = async () => {
    if (!(await ask("Se descargará un Excel de respaldo y luego se borrarán TODOS los pedidos, comprobantes y números. ¿Terminar la rifa?"))) return;
    exportCSV();
    const ops = [];
    S.orders.forEach((o) => { ops.push((b) => b.delete(doc(db, "orders", o.id)), (b) => b.delete(doc(db, "vouchers", o.id))); if (o.phone) ops.push((b) => b.delete(doc(db, "lookup", o.phone, "items", o.id))); });
    Object.keys(S.numbers).forEach((n) => ops.push((b) => b.delete(doc(db, "numbers", n))));
    try {
      await runOps(ops);
      await setDoc(doc(db, "settings", "main"), { winningNumber: "", winnerName: "", open: false }, { merge: true });
      toast("Rifa terminada. Configura el nuevo premio y reanuda la venta ▶️");
      setTimeout(tabSorteo, 400);
    } catch (e) { console.error(e); toast("Error reiniciando", true); }
  };
}

/* ----- mi cuenta ----- */
function tabCuenta() {
  $("#tabc").innerHTML = `<div class="card narrow" style="margin:0">
    <h3 style="margin-top:0">🔐 Cambiar contraseña del panel</h3>
    <p class="small muted">Usuario: <b style="color:var(--t)">${esc(ADMIN_USER)}</b></p>
    <label>Contraseña actual<div class="pw"><input type="password" id="pCur" autocomplete="current-password"></div></label>
    <label>Contraseña nueva (mínimo 8 caracteres)<div class="pw"><input type="password" id="pNew" autocomplete="new-password"></div></label>
    <label>Repetir contraseña nueva<div class="pw"><input type="password" id="pNew2" autocomplete="new-password"></div></label>
    <label class="chk" style="font-size:14px;color:var(--t);align-items:center"><input type="checkbox" id="pShow"> Mostrar contraseñas</label>
    <div id="pMsg"></div>
    <button class="btn green full" id="pGo">CAMBIAR CONTRASEÑA</button>
  </div>`;
  $("#pShow").onchange = (e) => ["#pCur", "#pNew", "#pNew2"].forEach((id) => ($(id).type = e.target.checked ? "text" : "password"));
  $("#pGo").onclick = async () => {
    const cur = $("#pCur").value, n1 = $("#pNew").value, n2 = $("#pNew2").value, msg = $("#pMsg");
    if (!cur) return (msg.innerHTML = `<div class="err">Escribe tu contraseña actual.</div>`);
    if (n1.length < 8) return (msg.innerHTML = `<div class="err">La nueva contraseña debe tener mínimo 8 caracteres.</div>`);
    if (n1 !== n2) return (msg.innerHTML = `<div class="err">Las contraseñas nuevas no coinciden.</div>`);
    $("#pGo").disabled = true;
    try {
      await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, cur));
      await updatePassword(auth.currentUser, n1);
      msg.innerHTML = `<div class="okmsg">✔ Contraseña cambiada. Úsala la próxima vez que entres.</div>`;
      ["#pCur", "#pNew", "#pNew2"].forEach((id) => ($(id).value = ""));
    } catch (e) {
      console.error(e);
      msg.innerHTML = `<div class="err">${["auth/wrong-password", "auth/invalid-credential", "auth/invalid-login-credentials"].includes(e.code) ? "La contraseña actual no es correcta." : e.code === "auth/too-many-requests" ? "Demasiados intentos. Espera unos minutos." : "No se pudo cambiar la contraseña."}</div>`;
    }
    $("#pGo").disabled = false;
  };
}

function exportCSV() {
  const rows = [["Fecha", "Nombre", "WhatsApp", "Números", "Cantidad", "Monto", "Cuenta", "Estado", "Tipo"]];
  S.orders.forEach((o) => rows.push([fmtDT(o.createdAt), o.name, o.phone ? fmtPhone(o.phone) : "", o.numbers.join(" "), o.numbers.length, o.total, o.account, o.status, o.manual ? "Manual" : "Web"]));
  const csv = "\uFEFF" + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `rifa-${(S.settings.title || "dk").replace(/\W+/g, "-")}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}
